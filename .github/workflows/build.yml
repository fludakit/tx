name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on JDK 25
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Build everything with JDK 25 (required for multi-release JAR compilation).
      # Tests are skipped here and run in the matrix below.
      - name: Build
        run: mvn -B -ntp install -DskipTests

      # Save the compiled targets so the test job can reuse them.
      - name: Cache Build Targets
        uses: actions/upload-artifact@v7
        with:
          name: compiled-project-modules
          path: |
            **/target/
            !**/target/maven-archiver/

  test:
    name: Run Tests on Java ${{ matrix.java-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '21', '25' ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Test Runtime Environment
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Download Compiled Targets
        uses: actions/download-artifact@v4
        with:
          name: compiled-project-modules

      # Execute tests across all modules.
      - name: Run Surefire Test Phase
        run: mvn -B -ntp surefire:test
