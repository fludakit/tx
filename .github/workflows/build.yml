name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
          server-id: "github-fludakit"

      # The multi-release overlay (META-INF/versions/25) needs JDK 25, so compilation
      # happens here exactly once. The test job never recompiles: it downloads these
      # outputs and runs surefire:test only.
      - name: Build
        run: mvn -B -ntp clean install -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve local repository path
        run: echo "M2_SNAPSHOTS=$HOME/.m2/repository/io/github/fludakit" >> "$GITHUB_ENV"

      - name: Upload compiled classes
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            */target/classes
            */target/test-classes
          if-no-files-found: error
          retention-days: 1

      - name: Upload installed modules
        uses: actions/upload-artifact@v4
        with:
          name: maven-snapshots
          path: ${{ env.M2_SNAPSHOTS }}
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test on Java ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        java-version: [21, 25]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven
          server-id: "github-fludakit"

      - name: Download compiled classes
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Resolve local repository path
        run: echo "M2_SNAPSHOTS=$HOME/.m2/repository/io/github/fludakit" >> "$GITHUB_ENV"

      - name: Download installed modules
        uses: actions/download-artifact@v4
        with:
          name: maven-snapshots
          path: ${{ env.M2_SNAPSHOTS }}

      # surefire:test is a direct plugin goal: it runs no lifecycle phase, so nothing is
      # recompiled here. maven.test.failure.ignore keeps the reactor going so every module
      # reports; the next step is the actual verdict.
      - name: Test
        run: mvn -B -ntp surefire:test -Dmaven.test.failure.ignore=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check test results
        run: |
          set -euo pipefail
          reports=$(find . -path '*/target/surefire-reports/*.txt' -type f | wc -l)
          echo "surefire report files: $reports"
          if [ "$reports" -eq 0 ]; then
            echo "::error::No tests ran — the build output was not restored"
            exit 1
          fi
          if grep -EH 'Failures: [1-9]|Errors: [1-9]' $(find . -path '*/target/surefire-reports/*.txt' -type f); then
            echo "::error::Test failures detected"
            exit 1
          fi
          echo "All tests passed"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java${{ matrix.java-version }}
          path: '*/target/surefire-reports'
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish to GitHub Packages
    needs: [build, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Publish to GitHub Packages
        run: mvn -B -ntp deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
